<!DOCTYPE html>

    <script src="../js/lang.js"></script>

<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <a href="./index.html">

    <nav>

            <div class="nav-group-title">ECS</div>

        </div>
        <div class="nav-group">
            <div class="nav-group-title">Utils</div>
            <a href="#memory" data-i18n="nav_memory"></a>
        </div>
    </nav>

    <div class="sidebar-back">
        <a href="../index.html" data-i18n="nav_back"></a>
    </div>

    <div class="page-header">

    <div class="dropdown theme-dropdown" style="right: 90px;">

        <a href="javascript:void(0)" class="dropbtn" id="lang-current">ES</a>
        <div class="dropdown-content">
            <a href="javascript:void(0)" onclick="Lang.load('es')">ES</a>

        </div>

    <section class="doc-section" id="ecs">
        <a href="ecs.html">ECS</a>

<button class="mobile-menu-btn" id="menuBtn" title="Toggle menu">☰</button>
